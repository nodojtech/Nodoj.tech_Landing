<style>
:root{
  --ink:#12161C; --night:#07090D; --surf:#161B22;
  --teal:#00CAAA; --teal-br:#00CAAA; --teal-deep:#07806E; --teal-ink:#0A6357; --teal-wash:#E1F7F1;
  --paper:#FFFFFF; --mist:#F3F4F6; --line:#E4E6EA; --slate:#5A6068; --grey:#8A929C;
  --bg:#F3F4F6; --dot:rgba(12,15,20,.13); --text:#0C0F14; --text-2:#5A6068; --accent:#0A6357;
  --btn-bg:#FFFFFF; --btn-bd:#E4E6EA; --btn-tx:#0C0F14; --btn-hv:#EDEFF2;
  --pri-bg:#00CAAA; --pri-tx:#04241E;
  --drop:rgba(12,15,20,.18);
  --sans:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:'Space Grotesk','Hanken Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --eout:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.2,.7,.2,1);
  --cw:min(310px,76vw); --ch:calc(var(--cw)/1.586); --cd:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07090D; --dot:rgba(255,255,255,.10); --text:#EDF1F5; --text-2:#A0A8B8; --accent:#00CAAA;
  --btn-bg:#12161C; --btn-bd:rgba(255,255,255,.14); --btn-tx:#EDF1F5; --btn-hv:#191E26;
  --pri-bg:#00CAAA; --pri-tx:#04241E; --drop:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#07090D; --dot:rgba(255,255,255,.10); --text:#EDF1F5; --text-2:#A0A8B8; --accent:#00CAAA;
  --btn-bg:#12161C; --btn-bd:rgba(255,255,255,.14); --btn-tx:#EDF1F5; --btn-hv:#191E26;
  --pri-bg:#00CAAA; --pri-tx:#04241E; --drop:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:24px 24px;background-position:0 0}
.sheet{width:100%;max-width:430px;padding:0 20px;padding-block:clamp(14px,3.4vh,28px);display:flex;flex-direction:column;gap:clamp(10px,2vh,18px)}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:8px}
.mark svg{width:15px;height:23px;color:var(--text);--pv:var(--accent)}
.mark span{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark b{color:var(--accent);font-weight:600}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--btn-bd);background:var(--btn-bg);color:var(--text);cursor:pointer;transition:background .2s var(--ease)}
.iconbtn:hover{background:var(--btn-hv)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.scene{display:grid;place-items:center;padding:clamp(10px,2.4vh,20px) 0 clamp(20px,3.4vh,30px);perspective:1100px;position:relative}
.tilt{transform-style:preserve-3d;will-change:transform}
.card{position:relative;width:var(--cw);height:var(--ch);transform-style:preserve-3d;transition:transform .62s var(--eout);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;background:var(--ink);padding:clamp(13px,4.2vw,17px);color:#EDF1F5}
.front{transform:translateZ(calc(var(--cd)/2));background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:13px 13px}
.back{transform:translateZ(calc(var(--cd)/-2)) rotateY(180deg);background:#122334}
.edge{position:absolute;background:var(--teal-deep)}
.edge.ex{top:15px;left:50%;width:var(--cd);height:calc(100% - 30px);margin-left:calc(var(--cd)/-2)}
.edge.ey{left:15px;top:50%;height:var(--cd);width:calc(100% - 30px);margin-top:calc(var(--cd)/-2)}
.edge.r{transform:translateX(calc(var(--cw)/2)) rotateY(90deg)}
.edge.l{transform:translateX(calc(var(--cw)/-2)) rotateY(90deg)}
.edge.t{transform:translateY(calc(var(--ch)/-2)) rotateX(90deg)}
.edge.b{transform:translateY(calc(var(--ch)/2)) rotateX(90deg)}
.drop{position:absolute;bottom:clamp(6px,1.6vh,14px);left:50%;margin-left:calc(var(--cw)*-.36);width:calc(var(--cw)*.72);height:16px;border-radius:999px;background:var(--drop);filter:blur(11px);transform:translateX(var(--dx,0px)) scaleX(var(--dsc,1));z-index:-1}

.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ctop .mark svg{width:19px;height:23px;color:#EAF2F0;--pv:var(--teal-br)}
.ctop .mark span{color:#EAF2F0;font-size:15px}
.ctop .mark b{color:var(--teal-br)}
.desc{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#7D8B9A;text-align:right;line-height:1.5;padding-top:3px}
.cbot{position:absolute;left:clamp(13px,4.2vw,17px);bottom:clamp(12px,3.6vw,15px)}
.cbot strong{display:block;font-family:var(--disp);font-size:clamp(13px,3.9vw,15.5px);font-weight:500;letter-spacing:-.01em;line-height:1.25;white-space:nowrap}
.cbot span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8AA0B4}
.nfc{position:absolute;right:clamp(12px,3.6vw,15px);bottom:clamp(12px,3.6vw,15px);display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:#5C6B7A}
.nfc svg{width:13px;height:13px;stroke:#5C6B7A;fill:none;stroke-width:2;stroke-linecap:round}
.sheen{position:absolute;inset:-70% -45%;background:linear-gradient(104deg,rgba(255,255,255,0) 41%,rgba(255,255,255,.13) 50%,rgba(255,255,255,0) 59%);transform:translateX(var(--sx,-34px));opacity:var(--so,.5);pointer-events:none}
.conn{position:absolute;left:clamp(14px,4.4vw,18px);top:50%;margin-top:-9px;display:flex;align-items:center}
.conn b{width:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.3);flex:none}
.conn i{width:clamp(16px,5vw,22px);height:1px;background:rgba(255,255,255,.17);flex:none}

.back .bwrap{display:flex;gap:12px;height:100%;align-items:center}
.bdata{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(9px,2.2vh,14px)}
.brow{display:flex;flex-direction:column;gap:1px;min-width:0}
.brow span{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8A929C}
.brow b{font-size:clamp(11px,3.3vw,12.5px);font-weight:500;color:#EDF1F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr{flex:none;width:clamp(72px,22vw,84px);border-radius:8px;background:#fff;padding:5px;display:grid;place-items:center}
.qr img,.qr canvas{display:block;width:100%!important;height:auto!important}
.qrtx{font-family:var(--mono);font-size:7.5px;line-height:1.35;color:#0C0F14;text-align:center;word-break:break-all;padding:4px}
.qrcap{position:absolute;right:clamp(13px,4.2vw,17px);bottom:5px;font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:#5A6068}

.hint{align-self:center;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 10px;margin:-8px 0 0;cursor:pointer}
.hint.act{border-color:var(--btn-bd);border-style:dashed;padding:9px 18px;color:var(--text)}
.hint svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.who{text-align:center;display:flex;flex-direction:column;gap:3px}
.who h1{font-family:var(--disp);font-weight:600;font-size:clamp(23px,6.6vw,29px);letter-spacing:-.02em;line-height:1.08;margin:0}
.who h1 span{display:block}
.who p{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}

.acts{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:10px;border:1px solid var(--btn-bd);background:var(--btn-bg);color:var(--btn-tx);font-family:var(--sans);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--btn-hv)}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-tx)}
.row .btn,.row3 .btn{height:48px;font-size:14.5px}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--teal-wash),0 0 0 5px var(--teal)}

.foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px;text-align:center}
.foot p{margin:0;font-size:12.5px;color:var(--text-2)}
.foot a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);text-decoration:none}

.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:398px;margin:0 auto;background:var(--ink);color:#EAF2F0;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;opacity:0;transform:translateY(10px);transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:none}

.enter .card{animation:land .72s var(--eout) both}
@keyframes land{from{opacity:0;transform:translateY(-46px) rotateX(26deg) rotateZ(-5deg) scale(.88)}to{opacity:1;transform:none}}
.enter .who,.enter .acts,.enter .hint,.enter .foot{animation:rise .5s var(--eout) both}
.enter .who{animation-delay:.3s}.enter .hint{animation-delay:.34s}.enter .acts{animation-delay:.38s}.enter .foot{animation-delay:.46s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-height:680px){:root{--cw:min(272px,70vw)}.btn{height:46px}.row .btn,.row3 .btn{height:44px}}
.face{padding:0;background:#0C0F14;border-radius:calc(var(--cw) * .0374)}
.front{background-image:none}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.back{background:#10151C;padding:clamp(13px,4.2vw,17px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn-bg:#12161C}}
:root[data-theme="dark"]{--btn-bg:#12161C}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.stage{position:relative;z-index:1}
:root{--net-rgb:12,15,20;--pv-rgb:10,99,87}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--net-rgb:255,255,255;--pv-rgb:0,202,170}}
:root[data-theme="dark"]{--net-rgb:255,255,255;--pv-rgb:0,202,170}
body[data-bg="on"] .stage{background-image:none}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var card = document.getElementById('card');
  var tilt = document.getElementById('tilt');
  var drop = document.getElementById('drop');
  var stage = document.getElementById('stage');
  var toastEl = document.getElementById('toast');
  var URL_TARJETA = 'https://www.nodoj.tech/juanpablo';

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 4200);
  }
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-toast]');
    if(el) toast(el.getAttribute('data-toast'));
  });

  try{
    if(window.QRCode){
      var box = document.getElementById('qr');
      box.textContent = '';
      new QRCode(box, { text: URL_TARJETA, width: 160, height: 160, colorDark: '#0C0F14', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
    }
  }catch(err){}

  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(err){} }
  function flip(){ card.classList.toggle('flip'); buzz(12); pedirPermiso(); }
  card.addEventListener('click', flip);
  card.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); }
  });

  var cur = {x:0,y:0}, tgt = {x:0,y:0}, running = false;
  function frame(){
    cur.x += (tgt.x - cur.x) * 0.11;
    cur.y += (tgt.y - cur.y) * 0.11;
    tilt.style.transform = 'rotateY(' + cur.x.toFixed(2) + 'deg) rotateX(' + (-cur.y).toFixed(2) + 'deg)';
    var sh = card.querySelector('.sheen');
    if(sh){
      sh.style.setProperty('--sx', (cur.x * 7).toFixed(1) + 'px');
      sh.style.setProperty('--so', (0.45 + Math.min(Math.abs(cur.x) / 20, 1) * 0.55).toFixed(2));
    }
    drop.style.setProperty('--dx', (cur.x * -1.5).toFixed(1) + 'px');
    drop.style.setProperty('--dsc', (1 - Math.abs(cur.y) / 90).toFixed(3));
    stage.style.backgroundPosition = (cur.x * 1.1).toFixed(1) + 'px ' + (cur.y * 1.1).toFixed(1) + 'px';
    if(Math.abs(tgt.x - cur.x) > 0.04 || Math.abs(tgt.y - cur.y) > 0.04) requestAnimationFrame(frame);
    else running = false;
  }
  function aim(x, y){
    if(reduce) return;
    tgt.x = Math.max(-18, Math.min(18, x));
    tgt.y = Math.max(-13, Math.min(13, y));
    if(!running){ running = true; requestAnimationFrame(frame); }
  }

  var scene = document.querySelector('.scene');
  scene.addEventListener('pointermove', function(e){
    if(e.pointerType === 'mouse'){
      var r = scene.getBoundingClientRect();
      aim(((e.clientX - r.left) / r.width - 0.5) * 30, ((e.clientY - r.top) / r.height - 0.5) * 20);
    }
  });
  scene.addEventListener('pointerleave', function(){ aim(0, 0); });
  scene.addEventListener('touchmove', function(e){
    var t = e.touches[0]; if(!t) return;
    var r = scene.getBoundingClientRect();
    aim(((t.clientX - r.left) / r.width - 0.5) * 30, ((t.clientY - r.top) / r.height - 0.5) * 20);
  }, {passive:true});

  function onOrient(e){
    if(e.gamma == null || e.beta == null) return;
    aim(e.gamma * 0.6, (e.beta - 42) * 0.34);
  }
  var hint = document.getElementById('hint');
  var hintTx = document.getElementById('hintTx');
  var hintIcon = document.getElementById('hintIcon');
  var pedido = false;
  var needsPerm = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';

  function hintGirar(){
    hint.classList.remove('act');
    hintTx.textContent = 'Toca la tarjeta para girarla';
    hintIcon.setAttribute('href', '#i-tap');
    hint.onclick = flip;
  }
  function pedirPermiso(){
    if(!needsPerm || pedido) return;
    pedido = true;
    DeviceOrientationEvent.requestPermission().then(function(res){
      if(res === 'granted'){
        window.addEventListener('deviceorientation', onOrient);
        hintGirar();
      } else { pedido = false; }
    }).catch(function(){ pedido = false; });
  }
  if(needsPerm && !reduce && window.matchMedia('(pointer:coarse)').matches){
    hint.classList.add('act');
    hintTx.textContent = 'Activa el movimiento';
    hintIcon.setAttribute('href', '#i-nfc');
    hint.onclick = pedirPermiso;
  } else {
    hintGirar();
    if(window.DeviceOrientationEvent && !needsPerm) window.addEventListener('deviceorientation', onOrient);
  }

  document.getElementById('vcard').addEventListener('click', function(){ buzz(14); });

  document.getElementById('share').addEventListener('click', function(){
    var datos = { title: 'Juan Pablo Valencia Manrique · Nodo J', text: 'Contacto de Juan Pablo Valencia Manrique, CEO de Nodo J', url: URL_TARJETA };
    if(navigator.share){ navigator.share(datos).catch(function(){}); return; }
    if(navigator.clipboard){
      navigator.clipboard.writeText(URL_TARJETA).then(function(){ toast('Enlace copiado: ' + URL_TARJETA); }).catch(function(){ toast(URL_TARJETA); });
      return;
    }
    toast(URL_TARJETA);
  });

  if(!reduce){
    var sheet = document.getElementById('sheet');
    sheet.classList.add('enter');
    setTimeout(function(){ sheet.classList.remove('enter'); }, 1200);
  }

  var cvs = document.getElementById('bg');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, dpr = 1, DIAG = 1, ticks = 0, ultimo = 0, intro = 0;
  var NET = '12,15,20', ACC = '0,202,170';
  var rCard = null, rCalma = null, ondas = [], dedo = { x: 0, y: 0, f: 0 };
  var PASO = 26, ALC = 122;

  function leerColores(){
    var cs = getComputedStyle(document.documentElement);
    NET = (cs.getPropertyValue('--net-rgb') || '12,15,20').trim();
    ACC = (cs.getPropertyValue('--pv-rgb') || '0,202,170').trim();
  }

  function medirZonas(){
    var c = card.getBoundingClientRect();
    var s = document.getElementById('sheet').getBoundingClientRect();
    rCard = { x: c.left, y: c.top, r: c.right, b: c.bottom };
    rCalma = { x: s.left, y: c.bottom + 4, r: s.right, b: s.bottom };
  }

  function enCalma(x, y){
    return rCalma && x > rCalma.x && x < rCalma.r && y > rCalma.y && y < rCalma.b;
  }

  function punto(x, y, r, color, alpha){
    if(enCalma(x, y)) alpha *= 0.38;
    ctx.fillStyle = 'rgba(' + color + ',' + alpha.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }

  // la tarjeta empuja la reticula cuando gira
  function ondaDesdeTarjeta(){
    if(reduce || ondas.length > 2) return;
    if(!rCard) medirZonas();
    ondas.push({ x: (rCard.x + rCard.r) / 2, y: (rCard.y + rCard.b) / 2, t: 0 });
  }

  function seguirDedo(e){
    var t = e.touches ? e.touches[0] : e;
    if(!t) return;
    dedo.x = t.clientX; dedo.y = t.clientY; dedo.f = 1;
  }

  function medir(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    DIAG = Math.sqrt(W * W + H * H);
    leerColores(); medirZonas();
  }

  function pintarFondo(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(cur.x * 0.8, cur.y * 0.8);

    var cx0 = W / 2, cy0 = H / 2;
    var revel = intro * DIAG * 0.62;
    var i, o, x, y, ph, s, dx, dy, ex, ey, d, f, rad, dif, r, alpha;

    for(y = PASO / 2; y < H + PASO; y += PASO){
      for(x = PASO / 2; x < W + PASO; x += PASO){
        dx = 0; dy = 0; ex = 0;

        if(intro < 1){
          d = Math.sqrt((x - cx0) * (x - cx0) + (y - cy0) * (y - cy0));
          if(d > revel) continue;
          if(revel - d < 64) ex += (1 - (revel - d) / 64) * 0.9;
        }

        for(i = 0; i < ondas.length; i++){
          o = ondas[i];
          rad = o.t * DIAG * 0.78;
          d = Math.sqrt((x - o.x) * (x - o.x) + (y - o.y) * (y - o.y)) || 1;
          dif = d - rad;
          if(dif > -72 && dif < 72){
            f = Math.cos(dif / 72 * 1.5708) * (1 - o.t);
            dx += (x - o.x) / d * f * 10;
            dy += (y - o.y) / d * f * 10;
            ex += f * 0.95;
          }
        }

        if(dedo.f > 0.01){
          ey = dedo.x - x; d = dedo.y - y;
          rad = Math.sqrt(ey * ey + d * d) || 1;
          if(rad < ALC){
            f = (1 - rad / ALC) * dedo.f;
            dx += ey * f * 0.32; dy += d * f * 0.32;
            ex += f * 0.85;
          }
        }

        ph = x * 0.013 + y * 0.017 - ticks * 0.035;
        s = 0.5 + 0.5 * Math.sin(ph);
        r = 0.8 + s * 1.5 + ex * 2.4;
        alpha = Math.min(0.95, 0.1 + s * 0.3 + ex * 0.55);
        punto(x + dx, y + dy, r, (s > 0.985 || ex > 0.55) ? ACC : NET, alpha);
      }
    }
    ctx.restore();
  }

  function bucle(ts){
    requestAnimationFrame(bucle);
    if(document.hidden) return;
    if(ts - ultimo < 33) return;
    ultimo = ts; ticks++;
    if(intro < 1) intro = Math.min(1, intro + 0.03);
    for(var i = ondas.length - 1; i >= 0; i--){
      ondas[i].t += 0.013;
      if(ondas[i].t >= 1) ondas.splice(i, 1);
    }
    if(dedo.f > 0) dedo.f = Math.max(0, dedo.f - 0.022);
    if(ticks % 20 === 0) medirZonas();
    pintarFondo();
  }

  medir();
  document.body.setAttribute('data-bg', 'on');
  window.addEventListener('resize', medir);
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', leerColores);
  card.addEventListener('click', ondaDesdeTarjeta);
  card.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ') ondaDesdeTarjeta();
  });
  document.addEventListener('pointermove', seguirDedo, { passive: true });
  document.addEventListener('touchmove', seguirDedo, { passive: true });

  if(reduce){ intro = 1; ticks = 40; pintarFondo(); }
  else requestAnimationFrame(bucle);

})();
</script>
